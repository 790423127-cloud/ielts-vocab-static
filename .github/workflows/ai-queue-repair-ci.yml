name: AI queue repair verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/lib/ai/**"
      - "app/lib/api/**"
      - "app/lib/vocab/**"
      - "app/api/generate-word/**"
      - "app/api/generate-words/**"
      - "scripts/build-manual-vocab-audit-queue.mjs"
      - "package.json"
      - ".github/workflows/ai-queue-repair-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint errors
        run: npm run lint:errors

      - name: Run AI and quality regression tests
        run: >-
          node --test
          app/lib/vocab/__tests__/word-quality-status.test.mjs
          app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs
          app/lib/vocab/__tests__/admin-ai-batch-runner.test.mjs
          app/lib/vocab/__tests__/admin-ai-continuous-runner.test.mjs
          app/lib/vocab/__tests__/deepseek-word-profile.test.mjs
          app/lib/vocab/__tests__/local-admin-guard.test.mjs

      - name: Build deterministic vocabulary audit queue
        run: npm run audit:vocab-manual-queue

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: manual-vocab-audit-queue
          path: reports/manual-vocab-audit
          if-no-files-found: error
          retention-days: 30
