name: Apply reviewed AI client source patch

on:
  push:
    branches:
      - fix/ai-queue-audit-v1
    paths:
      - "scripts/apply-ai-client-source-patch.mjs"
      - ".github/workflows/apply-ai-client-source-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[client-patch-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-queue-audit-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply exact source patch
        run: node scripts/apply-ai-client-source-patch.mjs

      - name: Commit patched client files
        run: |
          if git diff --quiet; then
            echo "No client patch changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/hooks/useHomeLexiconAdmin.ai.js app/components/VocabAdminToolsPanel.jsx
          git commit -m "fix: continue AI queue after failed probe [client-patch-applied]"
          git push origin HEAD:fix/ai-queue-audit-v1
