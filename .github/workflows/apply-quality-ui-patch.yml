name: Apply quality queue UI patch

on:
  push:
    branches:
      - fix/ai-queue-audit-v1
    paths:
      - "scripts/apply-quality-ui-patch.py"
      - ".github/workflows/apply-quality-ui-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-queue-audit-v1
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 scripts/apply-quality-ui-patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint changed application code
        run: npm run lint:errors

      - name: Run quality queue tests
        run: |
          node --test \
            app/lib/vocab/__tests__/word-quality-status.test.mjs \
            app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs \
            app/lib/vocab/__tests__/admin-ai-continuous-runner.test.mjs

      - name: Remove one-time migration files
        run: git rm scripts/apply-quality-ui-patch.py .github/workflows/apply-quality-ui-patch.yml

      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/page.jsx \
            app/components/WordFlashcardView.jsx \
            app/components/VocabAdminToolsPanel.jsx \
            app/lib/vocab/word-flashcard-study-pool.mjs
          git commit -m "refactor: show required repair and optional enrichment separately"
          git push origin HEAD:fix/ai-queue-audit-v1
