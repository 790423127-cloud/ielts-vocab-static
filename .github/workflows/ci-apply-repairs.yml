name: Apply CI repairs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply deterministic repairs
        run: node scripts/ci-apply-repairs.mjs

      - name: Verify focused unit tests
        run: |
          node --test app/lib/spelling/__tests__/spelling-export.test.mjs
          node --test app/lib/spelling/__tests__/vocab-10k.test.mjs
          node --test app/lib/vocab/__tests__/word-flashcard-session.test.mjs
          node --test app/lib/vocab/__tests__/gt-10500-expansion.test.mjs
          node --test app/lib/vocab/__tests__/word-study-eligibility.test.mjs

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .static-export-cache/words.json public/data/words.json public/data/meaning-6000.json app/lib/vocab/master-lexicon-baseline.mjs app/lib/spelling/__tests__/spelling-export.test.mjs app/lib/spelling/__tests__/vocab-10k.test.mjs app/lib/vocab/__tests__/word-flashcard-session.test.mjs app/lib/vocab/__tests__/word-study-eligibility.test.mjs
          if git diff --cached --quiet; then
            echo "No deterministic repairs required"
          else
            git commit -m "fix: repair lexicon consistency and CI expectations"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
