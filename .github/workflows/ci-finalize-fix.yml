name: Finalize CI and AI start fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply final fixes
        run: node scripts/ci-finalize-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test app/lib/vocab/__tests__/word-flashcard-session.test.mjs 2>&1 | tee finalize-test.log
          npm run lint:errors 2>&1 | tee -a finalize-test.log

      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-fix-diagnostics-${{ github.run_id }}
          path: finalize-test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove finalizer and commit
        shell: bash
        run: |
          rm -f .github/workflows/ci-finalize-fix.yml scripts/ci-finalize-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete CI repair and make AI start actionable"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
