name: CI Wide (nightly)

on:
  schedule:
    # 08:00 UTC daily (~16:00 China)
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  wide:
    name: quality + test + test:wide + build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: ESLint errors
        run: npm run lint:errors

      - name: ESLint warning budget
        run: npm run lint:budget

      - name: Quality gates
        run: npm run quality:all

      - name: Unit tests
        run: npm test

      - name: Wide tests
        run: npm run test:wide

      - name: Production build
        run: npm run build
        env:
          DEEPSEEK_API_KEY: ""
