name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    name: quality + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: ESLint errors
        run: npm run lint:errors

      - name: ESLint warning budget
        run: npm run lint:budget

      - name: Quality gates
        run: npm run quality:all

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real secrets
          DEEPSEEK_API_KEY: ""

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser E2E and performance budgets
        run: npm run test:e2e
        env:
          DEEPSEEK_API_KEY: ""
