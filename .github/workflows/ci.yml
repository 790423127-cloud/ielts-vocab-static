name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: quality + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/static-cloud-deep-audit-swipe-v3

      - name: Apply verified static cloud fix
        run: |
          python3 -m py_compile scripts/apply-static-cloud-deep-fix.py
          python3 scripts/apply-static-cloud-deep-fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: verify mobile swipe in the real static export"
          git push origin HEAD:fix/static-cloud-deep-audit-swipe-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm run audit:dependencies -- --json 2>&1 | tee npm-audit.json

      - name: Upload dependency audit failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-failure-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: ESLint errors
        run: npm run lint:errors

      - name: ESLint warning budget
        run: npm run lint:budget

      - name: Quality gates
        run: npm run quality:all

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.run_id }}
          path: unit-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
        env:
          DEEPSEEK_API_KEY: ""

      - name: Export semantic review candidates
        run: node scripts/export-gt-semantic-review-candidates.mjs

      - name: Upload semantic review candidates
        uses: actions/upload-artifact@v4
        with:
          name: gt-semantic-review-candidates-${{ github.run_id }}
          path: |
            reports/gt-complete-semantic-review-candidates.json
            reports/gt-complete-semantic-review-candidates.tsv
            reports/gt-complete-vocab-patch-report.json
            reports/gt-second-semantic-review-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser E2E and performance budgets
        run: npm run test:e2e
        env:
          DEEPSEEK_API_KEY: ""

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
