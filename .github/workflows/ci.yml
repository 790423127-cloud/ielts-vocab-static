name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    name: quality + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: ESLint errors
        run: npm run lint:errors

      - name: ESLint warning budget
        run: npm run lint:budget

      - name: Quality gates
        run: npm run quality:all

      - name: Capture semantic test fixture
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('.static-export-cache/words.json','utf8'));const e=p.words.find(x=>x.word==='subject');fs.writeFileSync('subject-entry.json',JSON.stringify(e,null,2));console.log(JSON.stringify({word:e?.word,meaning:e?.meaning,meaningDetailedZh:e?.meaningDetailedZh,length:e?.meaningDetailedZh?.length,definition:e?.definition,semanticQualityV2:e?.semanticQualityV2},null,2));"

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.run_id }}
          path: |
            unit-test.log
            subject-entry.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
        env:
          # Build must not require real secrets
          DEEPSEEK_API_KEY: ""

      - name: Export semantic review candidates
        run: node scripts/export-gt-semantic-review-candidates.mjs

      - name: Upload semantic review candidates
        uses: actions/upload-artifact@v4
        with:
          name: gt-semantic-review-candidates-${{ github.run_id }}
          path: |
            reports/gt-complete-semantic-review-candidates.json
            reports/gt-complete-semantic-review-candidates.tsv
            reports/gt-complete-vocab-patch-report.json
            reports/gt-second-semantic-review-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser E2E and performance budgets
        run: npm run test:e2e
        env:
          DEEPSEEK_API_KEY: ""

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
