name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    name: quality + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Full vocabulary semantic audit
        run: node scripts/audit-all-vocab-semantic-quality.mjs

      - name: Upload full vocabulary semantic audit
        uses: actions/upload-artifact@v4
        with:
          name: full-vocab-semantic-audit-${{ github.run_id }}
          path: reports/full-vocab-semantic-audit
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: ESLint errors
        run: npm run lint:errors

      - name: ESLint warning budget
        run: npm run lint:budget

      - name: Quality gates
        run: npm run quality:all

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real secrets
          DEEPSEEK_API_KEY: ""

      - name: Export semantic review candidates
        run: node scripts/export-gt-semantic-review-candidates.mjs

      - name: Upload semantic review candidates
        uses: actions/upload-artifact@v4
        with:
          name: gt-semantic-review-candidates-${{ github.run_id }}
          path: |
            reports/gt-complete-semantic-review-candidates.json
            reports/gt-complete-semantic-review-candidates.tsv
            reports/gt-complete-vocab-patch-report.json
            reports/gt-second-semantic-review-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser E2E and performance budgets
        run: npm run test:e2e
        env:
          DEEPSEEK_API_KEY: ""

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
