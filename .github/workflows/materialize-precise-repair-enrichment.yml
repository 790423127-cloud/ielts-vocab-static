name: Materialize precise repair and enrichment package

on:
  push:
    branches:
      - fix/precise-structure-repair-v2
    paths:
      - scripts/apply-precise-repair-enrichment-patch.py
      - scripts/apply-precise-repair-enrichment-tests.py
      - .github/workflows/materialize-precise-repair-enrichment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[precise-repair-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/precise-structure-repair-v2
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 scripts/apply-precise-repair-enrichment-patch.py
          python3 scripts/apply-precise-repair-enrichment-tests.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint application code
        run: npm run lint:errors

      - name: Run precise repair regression tests
        run: >-
          node --test
          app/lib/vocab/__tests__/ai-field-repair-policy.test.mjs
          app/lib/vocab/__tests__/word-quality-status.test.mjs
          app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs
          app/lib/vocab/__tests__/admin-ai-batch-runner.test.mjs
          app/lib/vocab/__tests__/admin-ai-continuous-runner.test.mjs
          app/lib/vocab/__tests__/deepseek-word-profile.test.mjs
          app/lib/vocab/__tests__/local-admin-guard.test.mjs

      - name: Build replacement ZIP
        run: |
          mkdir -p replacement-package
          cp --parents \
            app/hooks/useHomeLexiconAdmin.ai.js \
            app/components/VocabAdminToolsPanel.jsx \
            app/lib/vocab/admin-ai-batch-plan.mjs \
            app/lib/vocab/ai-write-merge.mjs \
            app/lib/vocab/page-word-helpers.mjs \
            app/lib/vocab/ai-field-repair-policy.mjs \
            app/lib/vocab/__tests__/ai-field-repair-policy.test.mjs \
            app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs \
            REPLACE_PACKAGE_INSTRUCTIONS_CN.md \
            replacement-package/
          cd replacement-package
          zip -r ../precise-repair-enrichment-replacement.zip .

      - name: Upload replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: precise-repair-enrichment-replacement
          path: precise-repair-enrichment-replacement.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time materializer
        run: git rm scripts/apply-precise-repair-enrichment-patch.py scripts/apply-precise-repair-enrichment-tests.py .github/workflows/materialize-precise-repair-enrichment.yml

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/hooks/useHomeLexiconAdmin.ai.js \
            app/components/VocabAdminToolsPanel.jsx \
            app/lib/vocab/admin-ai-batch-plan.mjs \
            app/lib/vocab/ai-write-merge.mjs \
            app/lib/vocab/page-word-helpers.mjs \
            app/lib/vocab/ai-field-repair-policy.mjs \
            app/lib/vocab/__tests__/ai-field-repair-policy.test.mjs \
            app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs \
            REPLACE_PACKAGE_INSTRUCTIONS_CN.md
          git commit -m "fix: precise structure repair and safe optional enrichment [precise-repair-materialized]"
          git push origin HEAD:fix/precise-structure-repair-v2
