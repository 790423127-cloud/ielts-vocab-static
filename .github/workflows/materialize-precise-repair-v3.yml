name: Materialize precise repair v3

on:
  push:
    branches:
      - fix/precise-structure-repair-v2

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/precise-structure-repair-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize source changes
        run: python scripts/materialize-precise-repair-v3.py

      - name: Lint errors
        run: npm run lint:errors

      - name: Targeted regression tests
        run: >-
          node --test
          app/lib/vocab/__tests__/wrong-ai-word-detection.test.mjs
          app/lib/vocab/__tests__/word-quality-status.test.mjs
          app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs
          app/lib/vocab/__tests__/ai-field-repair-policy.test.mjs

      - name: Commit materialized repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "fix: eliminate structure false positives and verify repair exits"
          git push origin HEAD:fix/precise-structure-repair-v2
