name: One-time tidy copy patch

on:
  push:
    branches: [fix/persist-main-lexicon-and-removal-review]
    paths: [.github/workflows/one-time-tidy-copy-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-main-lexicon-and-removal-review
      - name: Replace stale wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("app/components/WordFlashcardView.jsx"): {
                  '["basic", "简单词"]': '["basic", "基础词候选"]',
                  '<strong>这个词值得看一眼</strong>': '<strong>这个词可能不需要留在主词库</strong>',
                  '<p>你点“留着”后它不会再出现；删除只影响雅思主词库，独立零基础 1500 仍会保留。</p>': '<p>你点“留着”后它不会再出现；删除成功后会写入正式主词库文件。</p>',
                  ' · 因熟悉自动留着 {tidyReview.stats?.autoKeptFamiliar || 0}': '',
              },
              Path("app/lib/vocab/word-flashcard-study-pool.mjs"): {
                  'if (filter.type === "tidy" && filter.value === "basic") return "简单词";': 'if (filter.type === "tidy" && filter.value === "basic") return "基础词候选";',
                  'desc: "简单词和可能重复的词放在这里，你来决定留不留；已熟悉的简单词不会重复出现。",': 'desc: "初高中一眼能认出的基础词和少量低价值名词，最多1500个，由你人工决定留不留。",',
              },
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes.items():
                  if old not in text:
                      raise SystemExit(f"missing expected text in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit wording changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/WordFlashcardView.jsx app/lib/vocab/word-flashcard-study-pool.mjs
          git commit -m "fix: clarify manual removal review wording"
          git push origin HEAD:fix/persist-main-lexicon-and-removal-review
