name: Patch main flash interactions

on:
  push:
    branches: [fix/main-flash-filter-and-swipe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/main-flash-filter-and-swipe
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply interaction fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path('app/lib/vocab/study-session.mjs')
          session = session_path.read_text(encoding='utf-8')
          old = '''  if (result.index >= 0) {
              return { ...result, switched: true };
            }
          '''
          new = '''  const outOfFilterReasons = new Set([
              "wordKeyOutOfFilter",
              "entryPositionOutOfFilter",
              "savedIndexOutOfFilter"
            ]);

            if (result.index >= 0 && !outOfFilterReasons.has(result.reason)) {
              return { ...result, switched: true };
            }
          '''
          if old not in session:
              raise SystemExit('filter switch acceptance block not found')
          session_path.write_text(session.replace(old, new, 1), encoding='utf-8')

          helper_path = Path('app/lib/vocab/word-flashcard-swipe.mjs')
          helper_path.write_text('''export const WORD_CARD_SWIPE_THRESHOLD = 48;
          export const WORD_CARD_SWIPE_DOMINANCE = 1.2;

          export function resolveWordCardSwipe({
            startX,
            startY,
            endX,
            endY,
            threshold = WORD_CARD_SWIPE_THRESHOLD,
            dominance = WORD_CARD_SWIPE_DOMINANCE
          } = {}) {
            const deltaX = Number(endX) - Number(startX);
            const deltaY = Number(endY) - Number(startY);
            if (![deltaX, deltaY].every(Number.isFinite)) return "";

            const horizontal = Math.abs(deltaX);
            const vertical = Math.abs(deltaY);
            if (horizontal < threshold || horizontal <= vertical * dominance) return "";
            return deltaX < 0 ? "next" : "previous";
          }
          ''', encoding='utf-8')

          view_path = Path('app/components/WordFlashcardView.jsx')
          view = view_path.read_text(encoding='utf-8')

          import_marker = 'import { getWordStudyProgressLabel } from "../lib/vocab/word-study-overview.mjs";\n'
          import_line = 'import { resolveWordCardSwipe } from "../lib/vocab/word-flashcard-swipe.mjs";\n'
          if import_line not in view:
              if import_marker not in view:
                  raise SystemExit('view import marker not found')
              view = view.replace(import_marker, import_marker + import_line, 1)

          refs_old = '''  const libraryMenuRef = useRef(null);
            const pendingSearchRef = useRef("");
          '''
          refs_new = '''  const rangeMenuRef = useRef(null);
            const libraryMenuRef = useRef(null);
            const swipeStartRef = useRef(null);
            const pendingSearchRef = useRef("");
          '''
          if refs_old not in view:
              raise SystemExit('view refs marker not found')
          view = view.replace(refs_old, refs_new, 1)

          related_marker = '''  const relatedWords = useMemo(
              () => getRelatedWords(item, displayFamily, activeWordPool),
              [activeWordPool, displayFamily, item]
            );

            nextWordRef.current = nextWord;
          '''
          related_new = '''  const relatedWords = useMemo(
              () => getRelatedWords(item, displayFamily, activeWordPool),
              [activeWordPool, displayFamily, item]
            );

            const handleCardPointerDown = (event) => {
              if (event.pointerType === "mouse" || isStudyEmpty) return;
              if (event.target.closest?.("button, a, input, select, textarea, summary, details, [contenteditable='true']")) return;
              swipeStartRef.current = {
                pointerId: event.pointerId,
                x: event.clientX,
                y: event.clientY
              };
            };

            const handleCardPointerUp = (event) => {
              const start = swipeStartRef.current;
              swipeStartRef.current = null;
              if (!start || start.pointerId !== event.pointerId) return;

              const direction = resolveWordCardSwipe({
                startX: start.x,
                startY: start.y,
                endX: event.clientX,
                endY: event.clientY
              });
              if (direction === "next") nextWord();
              if (direction === "previous") prevWord();
            };

            nextWordRef.current = nextWord;
          '''
          if related_marker not in view:
              raise SystemExit('view swipe insertion marker not found')
          view = view.replace(related_marker, related_new, 1)

          range_old = '<details className="menu word-study-menu">\n      <summary className="top-pill">学习范围</summary>'
          range_new = '<details className="menu word-study-menu" ref={rangeMenuRef}>\n      <summary className="top-pill">学习范围</summary>'
          if range_old not in view:
              raise SystemExit('range details marker not found')
          view = view.replace(range_old, range_new, 1)

          click_old = 'onClick={() => setLibraryFilter(entry.filter.type, entry.filter.value)}'
          click_new = '''onClick={() => {
                    setLibraryFilter(entry.filter.type, entry.filter.value);
                    if (rangeMenuRef.current) rangeMenuRef.current.open = false;
                  }}'''
          if click_old not in view:
              raise SystemExit('range filter click marker not found')
          view = view.replace(click_old, click_new, 1)

          card_old = '<article className="word-study-card">'
          card_new = '''<article
                className="word-study-card"
                style={{ touchAction: "pan-y" }}
                onPointerDown={handleCardPointerDown}
                onPointerUp={handleCardPointerUp}
                onPointerCancel={() => { swipeStartRef.current = null; }}
              >'''
          if card_old not in view:
              raise SystemExit('word study card marker not found')
          view = view.replace(card_old, card_new, 1)
          view_path.write_text(view, encoding='utf-8')

          test_path = Path('app/lib/vocab/__tests__/main-flash-interactions.test.mjs')
          test_path.write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { resolveFilterSwitchIndex } from "../study-session.mjs";
          import { resolveWordStudyIndex } from "../word-flashcard-session.mjs";
          import { resolveWordCardSwipe } from "../word-flashcard-swipe.mjs";

          const words = [
            { word: "alpha", difficulty: "A" },
            { word: "beta", difficulty: "B" }
          ];
          const filterKey = (filter) => `${filter.type}:${filter.value || ""}`;
          const normalizeWord = (value) => String(value || "").trim().toLowerCase();
          const wordMatchesFilter = (word, filter) => word.difficulty === filter.value;

          test("manual category switch rejects a saved word outside the new category", () => {
            const filter = { type: "difficulty", value: "B" };
            const result = resolveFilterSwitchIndex(resolveWordStudyIndex, {
              words,
              entryPositions: { [filterKey(filter)]: "alpha" },
              filter,
              filterKey,
              wordMatchesFilter,
              normalizeWord,
              findFirstInFilter: () => 1
            });

            assert.equal(result.index, 1);
            assert.equal(result.reason, "filterFirst");
          });

          test("manual category switch restores a saved word only when it belongs to the category", () => {
            const filter = { type: "difficulty", value: "B" };
            const result = resolveFilterSwitchIndex(resolveWordStudyIndex, {
              words,
              entryPositions: { [filterKey(filter)]: "beta" },
              filter,
              filterKey,
              wordMatchesFilter,
              normalizeWord,
              findFirstInFilter: () => 1
            });

            assert.equal(result.index, 1);
            assert.equal(result.reason, "entryPosition");
          });

          test("word card swipe distinguishes horizontal navigation from vertical scrolling", () => {
            assert.equal(resolveWordCardSwipe({ startX: 200, startY: 100, endX: 120, endY: 110 }), "next");
            assert.equal(resolveWordCardSwipe({ startX: 100, startY: 100, endX: 180, endY: 110 }), "previous");
            assert.equal(resolveWordCardSwipe({ startX: 100, startY: 100, endX: 115, endY: 190 }), "");
            assert.equal(resolveWordCardSwipe({ startX: 100, startY: 100, endX: 135, endY: 105 }), "");
          });

          test("main word card wires mobile swipe and closes the range menu after selection", () => {
            const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../../..");
            const source = fs.readFileSync(path.join(root, "components/WordFlashcardView.jsx"), "utf8");
            assert.match(source, /touchAction:\s*"pan-y"/);
            assert.match(source, /onPointerDown=\{handleCardPointerDown\}/);
            assert.match(source, /resolveWordCardSwipe/);
            assert.match(source, /rangeMenuRef\.current\.open = false/);
          });
          ''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused tests and lint
        run: |
          node --test app/lib/vocab/__tests__/main-flash-interactions.test.mjs
          npm run lint:errors

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/vocab/study-session.mjs app/lib/vocab/word-flashcard-swipe.mjs app/components/WordFlashcardView.jsx app/lib/vocab/__tests__/main-flash-interactions.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix: switch main lexicon ranges and support mobile swipe"
          git push origin HEAD:fix/main-flash-filter-and-swipe
