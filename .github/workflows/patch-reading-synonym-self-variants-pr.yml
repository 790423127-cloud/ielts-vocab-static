name: Apply reading synonym variant patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/reading-synonym-self-variants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute the reviewed patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/patch-reading-synonym-self-variants.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, 'reading-synonym-patch.py', 'exec'))
          PY
      - name: Run targeted regression tests
        run: node --test app/lib/vocab/__tests__/word-flashcard-session.test.mjs app/lib/vocab/__tests__/deepseek-word-profile.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public
          git commit -m "fix: exclude headword spelling variants from reading synonyms"
          git push origin HEAD:${{ github.head_ref }}
