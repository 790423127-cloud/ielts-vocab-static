name: Patch reading relation review markers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/reading-word-relation-review-markers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply relation review marker patch
        run: node scripts/patch-reading-word-review-markers.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify focused tests
        run: |
          node --test app/lib/vocab/__tests__/word-flashcard-session.test.mjs
          npm run lint:errors

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm -f .github/workflows/patch-reading-word-review-markers.yml scripts/patch-reading-word-review-markers.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: track reviewed reading-word relations"
          git push origin "HEAD:${{ github.head_ref }}"
