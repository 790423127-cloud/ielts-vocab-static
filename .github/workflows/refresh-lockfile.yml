name: Refresh lockfile diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
