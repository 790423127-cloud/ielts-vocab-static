name: Temporary Audit Dependency Fix

on:
  push:
    branches:
      - audit/full-repair-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-repair-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply npm security lockfile fixes only
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Verify install and all dependency audits
        run: |
          npm ci
          npm run audit:dependencies
          npm run audit:dependencies:all
      - name: Commit lockfile only if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No dependency lockfile changes required"
            exit 0
          fi
          git config user.name "IELTS Vocab Audit Repair"
          git config user.email "local@ielts-vocab.dev"
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix: resolve audited development dependency vulnerabilities"
          git push origin HEAD:audit/full-repair-20260902
