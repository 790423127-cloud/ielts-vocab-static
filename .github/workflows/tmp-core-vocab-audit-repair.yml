name: Temporary Core Vocab Audit Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-core-vocab-audit-repair.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Reading G classification source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { normalizeHeadword } from './app/lib/vocab/lexicon-guard-shared.mjs';
          import { isBrushableWord } from './app/lib/vocab/word-study-eligibility.mjs';

          const masterPayload = JSON.parse(fs.readFileSync('.static-export-cache/words.json', 'utf8'));
          const master = masterPayload.words || [];
          const readingPayload = JSON.parse(fs.readFileSync('public/data/reading-g-vocab.json', 'utf8'));
          const reading = Array.isArray(readingPayload) ? readingPayload : readingPayload.items || readingPayload.words || [];
          const valid = new Set(['基础高频', '中级核心', '高级加分', '阅读扩展', '低频认识即可']);
          const sourceById = new Map(reading.map((entry) => [String(entry?.id || ''), entry]).filter(([id]) => id));
          const missingDifficulty = master.filter((entry) => isBrushableWord(entry) && !valid.has(entry?.difficulty));
          const readingAdded = missingDifficulty.filter((entry) => entry?.source === 'reading-g-ai');
          const sourceRows = readingAdded.map((entry) => ({ master: entry, source: sourceById.get(String(entry?.sourceReadingGId || '')) || null }));
          const group = (rows, pick) => {
            const out = {};
            for (const row of rows) {
              const key = String(pick(row) ?? '<missing>') || '<empty>';
              out[key] = (out[key] || 0) + 1;
            }
            return out;
          };
          const phrasesPayload = JSON.parse(fs.readFileSync('public/data/phrases.json', 'utf8'));
          const phrases = Array.isArray(phrasesPayload) ? phrasesPayload : phrasesPayload.phrases || [];
          const phraseKeys = new Set(phrases.map((entry) => normalizeHeadword(entry?.phrase || entry?.word)).filter(Boolean));
          const phraseCandidates = master.filter((entry) => isBrushableWord(entry) && (
            entry?.isPhrase || entry?.entryType === 'phrase' || entry?.pos === 'phrase' || normalizeHeadword(entry?.word).includes(' ')
          ));

          console.log('SOURCE_CHECK=' + JSON.stringify({
            readingItemCount: reading.length,
            missingDifficultyBrushableCount: missingDifficulty.length,
            readingAddedCount: readingAdded.length,
            sourceMatchedCount: sourceRows.filter((row) => row.source).length,
            sourceMissingCount: sourceRows.filter((row) => !row.source).length,
            sourceDifficultyCounts: group(sourceRows, (row) => row.source?.difficulty),
            sourceInvalidDifficultyCount: sourceRows.filter((row) => !row.source || !valid.has(row.source?.difficulty)).length,
            sourceInvalidPreview: sourceRows.filter((row) => !row.source || !valid.has(row.source?.difficulty)).slice(0, 50).map((row) => ({
              id: row.master.id,
              word: row.master.word,
              sourceReadingGId: row.master.sourceReadingGId,
              sourceDifficulty: row.source?.difficulty ?? '',
              sourceStudyMode: row.source?.studyMode ?? '',
              sourcePrimaryLayer: row.source?.primaryLayer ?? '',
              sourceArticleFrequency: row.source?.articleFrequency ?? null,
              sourceQuestionFrequency: row.source?.questionFrequency ?? null
            })),
            phraseLibraryCount: phrases.length,
            phraseCandidates: phraseCandidates.map((entry) => ({
              id: entry.id || entry.wordId || '',
              word: entry.word || '',
              alreadyInPhraseLibrary: phraseKeys.has(normalizeHeadword(entry.word)),
              pos: entry.pos || '',
              source: entry.source || ''
            }))
          }));
          NODE
