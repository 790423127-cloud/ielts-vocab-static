name: Temporary Core Vocab Audit Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-core-vocab-audit-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply scoped audit repair
        run: node .github/scripts/tmp-core-vocab-audit-repair.mjs

      - name: Run targeted tests and quality gates
        run: |
          node --test app/lib/reading-g-vocab/__tests__/master-content-sync.test.mjs app/lib/reading-words/__tests__/main-lexicon-sync-local.test.mjs scripts/core-vocab-quality-audit.test.mjs
          node scripts/core-vocab-quality-audit.mjs --gate
          node scripts/phrase-quality-gate.mjs --gate
          node scripts/sync-master-lexicon.mjs --check

      - name: Commit only after all checks pass
        run: |
          rm -f .github/workflows/tmp-core-vocab-audit-repair.yml .github/scripts/tmp-core-vocab-audit-repair.mjs
          git config user.name "IELTS Vocab Repair"
          git config user.email "local@ielts-vocab.dev"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix: repair formal lexicon quality gate"
          git push origin HEAD:main
