name: Temporary Serial Unit Diagnostic

on:
  push:
    branches:
      - audit/full-repair-20260902

jobs:
  serial-unit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run pretest serially
        run: |
          node --test --test-concurrency=1 app/lib/vocab/__tests__/admin-ai-continuous-runner.test.mjs app/lib/vocab/__tests__/lazy-chunk-recovery.test.mjs app/lib/vocab/__tests__/delete-navigation-performance.test.mjs app/lib/vocab/__tests__/lexicon-content-change.test.mjs app/lib/vocab/__tests__/lexicon-tidy-review.test.mjs
      - name: Run formal unit list serially
        run: |
          node --test --test-concurrency=1 app/lib/reading-g-vocab/__tests__/reading-g-example-quality.test.mjs app/lib/vocab/__tests__/vocab-meaning-display.test.mjs app/lib/vocab/__tests__/word-study-eligibility.test.mjs app/lib/vocab/__tests__/gt-10500-expansion.test.mjs app/lib/vocab/__tests__/gt-complete-vocab-patch.test.mjs app/lib/vocab/__tests__/gt-second-semantic-review.test.mjs app/lib/vocab/__tests__/phrase-flashcard.test.mjs app/lib/vocab/__tests__/word-runtime-quality.test.mjs app/lib/vocab/__tests__/example-skeleton-tails.test.mjs app/lib/vocab/__tests__/reading-synonyms.test.mjs app/lib/vocab/__tests__/reading-words-import-and-delete-shortcut.test.mjs app/lib/vocab/__tests__/local-admin-guard.test.mjs app/lib/vocab/__tests__/static-export-responsive.test.mjs app/lib/vocab/__tests__/static-export-final-route.test.mjs app/lib/vocab/__tests__/word-flashcard-session.test.mjs app/lib/vocab/__tests__/study-session.test.mjs app/lib/vocab/__tests__/phrase-flashcard-session.test.mjs app/lib/vocab/__tests__/lr-paraphrase-panel.test.mjs app/lib/vocab/__tests__/learning-entry-counts.test.mjs app/lib/vocab/__tests__/word-quality-status.test.mjs app/lib/vocab/__tests__/local-ai-boundary.test.mjs app/lib/vocab/__tests__/admin-ai-content-profile.test.mjs app/lib/vocab/__tests__/ai-write-merge.test.mjs app/lib/vocab/__tests__/admin-ai-batch-plan.test.mjs app/lib/vocab/__tests__/admin-ai-batch-runner.test.mjs app/lib/vocab/__tests__/deepseek-cache-recovery.test.mjs app/lib/vocab/__tests__/deepseek-word-profile.test.mjs app/lib/spelling/__tests__/vocab-10k.test.mjs app/lib/spelling/__tests__/vocab-speech-cache.test.mjs app/lib/spelling/__tests__/speech-audio-playback.test.mjs app/lib/spelling/__tests__/production-hook.test.mjs app/lib/spelling/__tests__/srs-review.test.mjs app/lib/spelling/__tests__/spelling-export.test.mjs app/lib/spelling/__tests__/spelling-categories.test.mjs app/lib/spelling/__tests__/personal-wrong-book.test.mjs app/lib/spelling/__tests__/personal-wrong-progress.test.mjs app/lib/spelling/__tests__/personal-wrong-lexicon-sync.test.mjs
