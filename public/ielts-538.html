<head>
  <meta charset="utf-8" />

  <title>538考点 · IELTS Vocab</title>

  <link rel="stylesheet" href="./assets/style.css?v=20260830_system_safety_v80" />
  <style>
    .hidden{display:none!important}
    .module-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
    .meta-pill{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:6px;background:#e5f2ed;color:#225f52;font-size:12px;font-weight:800}
    body.ielts-538-static{overflow-x:hidden}
    body.ielts-538-static .app{min-width:0}
    body.ielts-538-static .study538-filter-controls{min-width:0;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(150px,190px);align-items:center;gap:8px;flex:1}
    body.ielts-538-static .study538-filter-controls input,
    body.ielts-538-static .study538-filter-controls select{width:100%;min-width:0;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}
    body.ielts-538-static .study538-danger{color:#b24832!important;border-color:#efb9ae!important}
    body.ielts-538-static .hero{min-width:0;overflow-wrap:anywhere}
    body.ielts-538-static .study538-word-meta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    body.ielts-538-static .study538-pos{padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--green);font-size:.72em;font-weight:800}
    body.ielts-538-static .study538-meaning{color:var(--ink);font-weight:850}
    body.ielts-538-static .study538-para{min-width:0;display:grid;gap:7px;text-align:center}
    .study538-para-title{color:#8a9994;font-size:11px}.study538-replacement{display:flex;min-width:0;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:900}.study538-para-sentence{min-width:0;font-size:14px;font-weight:800;line-height:1.5;overflow-wrap:anywhere}.study538-para-cn{color:var(--muted);font-size:12px}
    .study538-section,.study538-recommended,.study538-extra-label{display:inline-flex;align-items:center;border-radius:999px;font-size:10px;font-style:normal;font-weight:900;white-space:nowrap}
    .study538-section{padding:4px 7px;border:1px solid #bdd8cf;color:var(--green);background:var(--soft)}.study538-recommended{color:#9a5a00}
    body.ielts-538-static .study538-related{min-width:0}
    .study538-related-title{display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px;color:#82918c;font-size:11px;font-weight:800}
    .study538-related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
    .study538-synonym{position:relative;min-width:0;min-height:112px;padding:12px 42px 12px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:left;cursor:pointer;overflow-wrap:anywhere}
    .study538-synonym.active{border-color:var(--ink);box-shadow:0 0 0 1px rgba(18,59,51,.08)}
    .study538-synonym-head{display:flex;min-width:0;align-items:center;gap:6px;flex-wrap:wrap}.study538-synonym-word{min-width:0;font-size:clamp(22px,1.45vw,29px);font-weight:900;line-height:1.18;color:var(--ink);overflow-wrap:anywhere}
    .study538-synonym-state{margin-top:4px;color:var(--muted);font-size:12px}.study538-extra{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:start;gap:5px;margin-top:6px;color:#355f53;font-size:12px;line-height:1.45;min-width:0}
    .study538-extra-label{padding:1px 5px;border-radius:4px;color:var(--green);background:var(--soft)}.study538-extra b{min-width:20px;padding:1px 5px;border-radius:4px;background:#f3f8f6;color:var(--muted);font-size:10px;text-align:center}.study538-extra span:last-child{min-width:0;white-space:normal;overflow-wrap:anywhere}
    .study538-sound{width:27px;height:27px;display:grid;place-items:center;border:1px solid #cce1da;border-radius:50%;background:var(--soft);color:var(--green);cursor:pointer}.study538-synonym>.study538-sound{position:absolute;right:7px;bottom:7px}
    body.ielts-538-static .known.active{box-shadow:inset 0 0 0 2px rgba(18,102,83,.28)}
    body.ielts-538-static .unknown.active{box-shadow:inset 0 0 0 2px rgba(168,61,28,.28)}
    @media(max-width:900px){body.ielts-538-static .study538-filter-controls{grid-template-columns:minmax(0,1fr) auto}body.ielts-538-static .study538-filter-controls select{grid-column:1/-1}.study538-para{order:7}.study538-related{order:8}.study538-related-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.study538-related-grid{grid-template-columns:1fr}}
  </style>
  <script src="./assets/static-font-scale.js?v=20260830_system_safety_v80"></script>
</head>
<body class="basic-static ielts-538-static" data-static-page="ielts-538">
  <header class="static-brand-bar">
    <a class="static-brand" href="./index.html"><span aria-hidden="true"></span>IELTS VOCAB</a>
    <div class="static-session-context"><strong>538考点</strong><span>376词 · 1257组新增真题替换 · 静态版</span></div>
    <nav class="static-brand-nav" data-static-primary-nav aria-label="主要学习模式">
      <a href="./index.html">主词库</a><a href="./reading-g.html">G类阅读</a><a href="./spelling.html">拼写</a>
    </nav>
  </header>
  <aside class="static-shell-sidebar" data-static-sidebar aria-label="全站学习导航">
    <nav><a href="./index.html">刷单词</a><a href="./spelling.html">拼写</a><a href="./meaning.html">选义</a></nav>
    <div class="static-shell-divider"></div>
    <span class="static-shell-label">专项学习</span>
    <nav><a class="active" href="./ielts-538.html">538考点</a><a href="./reading-g.html">G类阅读提升</a><a href="./basic.html">零基础词库</a><a href="./spelling.html?source=error_bank">错词本</a><a href="./spelling.html?source=srs_review">SRS 复习</a></nav>
  </aside>

  <main class="app" data-study-surface="ielts-538">
    <header id="basicTopbar" class="top basic-topbar">
      <button id="prevBtn" class="top-btn" type="button">上一个</button>
      <button id="topToolsToggle" class="top-tools-toggle" type="button" aria-expanded="true" aria-controls="basicTopTools basicFilterPanel">工具与词库</button>
      <div id="basicTopTools" class="top-actions">
        <a class="top-btn" href="./index.html">← 主词库</a>
        <button class="top-btn" type="button" data-study-meaning-toggle>隐藏释义</button>
        <button id="shuffleBtn" class="top-btn" type="button">随机</button>
        <button id="deleteBtn" class="top-btn study538-danger" type="button">删除</button>
        <button id="nextBtn" class="top-btn" type="button">下一个</button>
      </div>
      <div id="basicFilterPanel" class="basic-filter-panel">
        <div class="module-nav">
          <span class="meta-pill" id="rangeLabel">全部待学</span>
          <span class="meta-pill" id="statusSummary" aria-live="polite">学习状态加载中</span>
        </div>
        <div class="study538-filter-controls">
          <input id="searchInput" type="search" placeholder="搜索538考点词或同义词" aria-label="搜索单词" />
          <button id="searchBtn" class="top-btn" type="button">查询</button>
          <select id="filterSelect" aria-label="学习范围">
            <option value="aiCoachParaphrase">AI教练真题替换（1257组）</option>
            <option value="part3HighFrequency">G类阅读文章高频</option>
            <option value="all">全部待学</option>
            <option value="everything">全部376词</option>
            <option value="unfamiliar">不熟词</option>
            <option value="favorite">收藏词</option>
          </select>
        </div>
      </div>
    </header>

    <article id="studyCard" class="hero" data-static-swipe-card>
      <button id="favoriteBtn" class="star" type="button" title="收藏" aria-label="收藏">☆</button>
      <button id="wordSoundBtn" class="sound-main" type="button" title="播放单词">🔊</button>
      <div id="word" class="word">Loading</div>
      <div class="basic-line study538-word-meta study-answer-content">
        <span id="phonetic"></span><span id="pos" class="study538-pos"></span><span id="meaning" class="study538-meaning"></span>
      </div>
      <div id="positionMeta" class="load-info">正在读取词库</div>

      <section class="example-card study-answer-content">
        <div class="example-head">
          <button id="exampleSoundBtn" class="mini-sound example-sound" type="button" title="播放例句">🔊</button>
          <div id="exampleEn" class="example-en">正在准备学习内容</div>
        </div>
        <div id="exampleCn" class="example-cn"></div>
      </section>

      <section id="paraphrase" class="forms-box study538-para study-answer-content"></section>
      <section class="forms-box study538-related study-answer-content">
        <div class="study538-related-title">相关单词 / 同义替换 <button id="meaningToggle" class="top-btn hidden" type="button">隐藏释义</button></div>
        <div id="relatedGrid" class="study538-related-grid"></div>
      </section>
    </article>

    <footer class="bottom">
      <div class="actions">
        <button id="knownBtn" class="status known" type="button" title="快捷键：1">认识</button>
        <button id="unknownBtn" class="status unknown" type="button" title="快捷键：3">不熟</button>
      </div>
      <div class="progress-row">
        <div class="progress"><div id="progressFill" class="progress-fill" style="width:0"></div></div>
        <div id="progressCount" class="count">0 / 0</div>
      </div>
    </footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
