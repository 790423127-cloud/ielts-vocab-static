<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <title>拼写训练（遗留静态页）· 请优先用 /spelling-words</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="./assets/spelling.css?v=20260705_source_chapter_group_v6" />
</head>
<body>
  <main class="spell-app">
    <div class="deprecated-banner" role="status" style="margin:12px;padding:12px 14px;border-radius:12px;background:#fff3cd;border:1px solid #f0d78c;color:#5c4b00;line-height:1.5;">
      <strong>遗留静态页（已废弃主维护）</strong><br />
      正式入口请使用：
      <a href="/spelling-words">/spelling-words（单词拼写）</a>
      ·
      <a href="/spelling-phrases">/spelling-phrases（词组拼写）</a>
      。本页仅兼容旧链接/静态导出，功能可能落后于 React 版。
    </div>
    <header class="spell-top">
      <a class="back" href="./index.html">← 返回刷单词</a>
      <div class="mode-tabs entry-mode-tabs" role="tablist" aria-label="词条类型">
        <button data-mode="all" class="active">混合</button>
        <button data-mode="headwords">单词</button>
        <button data-mode="phrases">短语</button>
      </div>
    </header>

    <section class="spell-card">
      <p class="eyebrow">独立拼写系统 · 支持分类 / 爱听写 / 错词本 / 做题错词</p>
      <h1 id="title">拼写训练</h1>

      <div class="source-tabs-scroll">
        <div class="source-tabs" role="tablist" aria-label="练习来源">
          <button data-source="category" class="active">词库分类</button>
          <button data-source="idictation_listening">爱听写听力</button>
          <button data-source="idictation_reading">爱听写阅读</button>
          <button data-source="error_bank">错词本</button>
          <button data-source="personal_wrong_book">做题错词</button>
          <button data-source="srs_review">SRS复习</button>
        </div>
      </div>

      <div id="categoryPanel" class="control-panel">
        <div id="categoryQuickPicks" class="category-quick-picks" aria-label="常用词库分类"></div>
        <label class="control-label">
          分类类型
          <select id="categoryType"></select>
        </label>
        <label class="control-label">
          分类选项
          <select id="categoryValue"></select>
        </label>
        <div id="categoryValueQuickPicks" class="category-value-quick-picks" aria-label="当前分类选项"></div>
        <label class="control-label">
          批次
          <select id="batchIndex"></select>
        </label>
        <div id="batchStepper" class="batch-stepper" aria-label="批次切换">
          <button type="button" id="batchPrev">上一批</button>
          <span id="batchStepperLabel">第 1 批</span>
          <button type="button" id="batchNext">下一批</button>
        </div>
      </div>

      <div id="idictationPanel" class="control-panel" hidden>
        <p id="idictationSummary" class="panel-note"></p>
        <label class="control-label">
          原表章节
          <select id="idictationGroup"></select>
        </label>
        <label class="control-label">
          本章节
          <select id="idictationBatch"></select>
        </label>
      </div>

      <div id="personalWrongPanel" class="control-panel" hidden>
        <p class="panel-note">手动添加做错的词，每行一个。单词可写 <code>原形,变形</code>，短语直接写整句。</p>
        <textarea id="personalWrongInput" rows="3" placeholder="例如：accommodation&#10;child,children"></textarea>
        <div class="panel-actions">
          <button type="button" id="addPersonalWrong" class="panel-btn">添加到做题错词</button>
          <button type="button" id="clearPersonalWrong" class="panel-btn ghost">清空列表</button>
        </div>
        <div id="personalWrongList" class="personal-wrong-list"></div>
      </div>

      <div id="stats" class="stats"></div>
      <div class="toggle"><label><input id="includeFamiliar" type="checkbox" /> 包含刷单词已熟悉内容（分类模式）</label></div>
      <div id="question" class="question">正在读取词库与短语层…</div>
      <div id="audioBar" class="audio-bar" hidden>
        <button type="button" id="playWord" class="audio-btn" aria-label="播放单词发音">
          <span class="audio-icon" aria-hidden="true">🔊</span>
          <span class="audio-label">单词</span>
        </button>
        <button type="button" id="playExample" class="audio-btn" aria-label="播放例句发音">
          <span class="audio-icon" aria-hidden="true">🔊</span>
          <span class="audio-label">例句</span>
        </button>
        <button type="button" id="skipBtn" class="audio-btn ghost">跳过</button>
      </div>
      <form id="form" class="form">
        <input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文拼写" disabled />
        <button type="submit" id="submit" disabled>提交</button>
        <button type="button" id="hint" disabled>提示</button>
      </form>
      <div id="errorAnalysis" class="static-error-analysis" aria-live="polite" hidden></div>
      <div id="progress" class="spelling-progress" aria-label="当前批次进度"></div>
      <div id="feedback" class="feedback"></div>
      <p class="note desktop-hint">Tab 播放单词，Space 播放例句，Enter 提交，Ctrl+Enter 跳过。拼错的词会自动进入错词本。</p>
      <p class="note mobile-hint">点上方按钮播放发音；拼错的词会自动进入错词本。</p>
    </section>
  </main>
  <script src="./assets/spelling.js?v=20260709_lazy_sources_v8"></script>
</body>
</html>
